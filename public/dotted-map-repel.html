<!DOCTYPE html>
<html lang="en">

<title>Dotted Map — Repel Hover</title>
<script>
  document.documentElement.dataset.embed = new URLSearchParams(window.location.search).has("embed")
    ? "true"
    : "false";
</script>
<style>
  :root {
    --card-bg: #1C1C1E;   /* card / map background */
    --dot: #1566EB;       /* dot fill (exact from Figma) */
    --home: #EB9D15;      /* Dallas marker fill (exact from Figma) */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f10;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .map-card {
    width: 340px;
    height: 200px;
    background: var(--card-bg);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; }

  html[data-embed="true"],
  html[data-embed="true"] body {
    --card-bg: #ffffff;
    width: 100%;
    height: 100%;
    min-height: 0;
    overflow: hidden;
    background: transparent;
  }

  html[data-embed="true"] body {
    display: block;
  }

  html[data-embed="true"] .map-card {
    width: 100vw;
    height: 100vh;
    border: 0;
    border-radius: 10px;
    background: #ffffff;
  }
</style>
</head>
<body>

<div class="map-card">
  <canvas id="dotted-map"></canvas>
</div>

  - Dallas marker: center (509,459), radius 16.5, fill #EB9D15, 5px white stroke

  - Dots near the cursor get pushed away, then spring back (damped spring)
  - Displaced dots brighten toward a light blue proportional to displacement

  - Map scales to whatever size .map-card is; all physics run in frame space

95,638,1231,638,1267,638,1303,638,1339,638,1375,638,1411,638,1710,673,1746,673,651,675,687,675,721,675,760,675,794,675,1046,675,1083,675,1120,675,1157,675,1194,675,1231,675,1267,675,1303,675,1339,675,1375,675,1411,675,1602,675,1845,675,1881,675,615,711,651,711,685,711,724,711,760,711,794,711,830,711,1709,711,1745,711,1781,711,1809,711,1845,711,1939,711,1157,712,1194,712,1231,712,1268,712,1304,712,1340,712,1375,712,615,747,652,747,689,747,726,747,763,747,800,747,836,747,872,747,903,747,1766,747,1809,747,1845,747,1939,747,1975,747,2003,747,1156,749,1193,749,1230,749,1267,749,1303,749,1339,749,615,783,652,783,689,783,726,783,763,783,800,783,836,783,872,783,903,783,1406,783,1903,783,1975,783,2003,783,1193,786,1230,786,1267,786,1303,786,1339,786,1193,818,1230,818,1267,818,1303,818,1339,818,1372,818,1406,818,652,819,688,819,722,819,760,819,796,819,830,819,866,819,1865,819,1901,819,1937,819,1965,819,688,855,724,855,758,855,794,855,830,855,864,855,1193,855,1230,855,1267,855,1303,855,1372,855,1767,855,1803,855,1839,855,1867,855,1903,855,1939,855,1967,855,2003,855,685,891,721,891,755,891,794,891,830,891,1801,891,1837,891,1873,891,1901,891,1937,891,1973,891,2001,891,1193,892,1230,892,1267,892,1303,892,685,927,721,927,755,927,794,927,1801,927,1837,927,1873,927,1901,927,1937,927,1973,927,2009,927,2163,927,1230,929,1267,929,685,963,721,963,755,963,1939,963,1975,963,2163,963,652,999,688,999,722,999,2126,999,2163,999,2126,1034,653,1035,689,1035,689,1071];

const FRAME_W = 2216, FRAME_H = 1241, DOT_R = 10;
const HOME = { x: 509, y: 459, r: 16.5, stroke: 5 };

// ---- Tuning knobs ----
const REPEL_RADIUS = 240;   // cursor influence radius, frame units
const REPEL_FORCE  = 26;    // push strength
const SPRING       = 0.12;  // pull back toward home position
const DAMPING      = 0.82;  // velocity decay per frame (lower = calmer)
const BRIGHTEN_MAX = 0.5;   // how far displaced dots shift toward light blue (0..1)
const PING_PERIOD  = 2400;  // Dallas ping loop, ms

const canvas = document.getElementById("dotted-map");
const ctx = canvas.getContext("2d");
const card = canvas.parentElement;

const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// color lerp: #1566EB -> light blue
const BLUE = [0x15, 0x66, 0xEB], LIGHT = [0xCF, 0xE2, 0xFF];
const mix = (t) => `rgb(${BLUE.map((c, i) => Math.round(c + (LIGHT[i] - c) * t)).join(",")})`;

// dot state: home position + physics offset/velocity
const dots = [];
for (let i = 0; i < DOTS.length; i += 2) {
  if (DOTS[i] === HOME.x && DOTS[i + 1] === HOME.y) continue; // Dallas replaces this dot
  dots.push({ x: DOTS[i], y: DOTS[i + 1], ox: 0, oy: 0, vx: 0, vy: 0 });
}

let scale, cx, cy, w, h, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1;
  w = card.clientWidth;
  h = card.clientHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  scale = Math.min(w / FRAME_W, h / FRAME_H) * 1.08;
  cx = FRAME_W / 2;
  cy = FRAME_H * 0.46;
}
resize();
window.addEventListener("resize", resize);

const toScreen = (fx, fy) => [(fx - cx) * scale + w / 2, (fy - cy) * scale + h / 2];
const toFrame  = (sx, sy) => [(sx - w / 2) / scale + cx, (sy - h / 2) / scale + cy];

const pointer = { x: -1e9, y: -1e9 };
canvas.addEventListener("pointermove", (e) => {
  const r = canvas.getBoundingClientRect();
  [pointer.x, pointer.y] = toFrame(e.clientX - r.left, e.clientY - r.top);
});
canvas.addEventListener("pointerleave", () => { pointer.x = pointer.y = -1e9; });

const t0 = performance.now();

function render(now) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = cssVar("--card-bg");
  ctx.fillRect(0, 0, w, h);

  const dotColor = cssVar("--dot");

  for (const d of dots) {
    const dx = d.x - pointer.x, dy = d.y - pointer.y;
    const dist = Math.hypot(dx, dy);
    const t = Math.max(0, 1 - dist / REPEL_RADIUS);

    if (t > 0 && dist > 0.001) {
      const f = t * t * REPEL_FORCE;
      d.vx += (dx / dist) * f;
      d.vy += (dy / dist) * f;
    }
    d.vx += -d.ox * SPRING;
    d.vy += -d.oy * SPRING;
    d.vx *= DAMPING;
    d.vy *= DAMPING;
    d.ox += d.vx;
    d.oy += d.vy;

    const disp = Math.hypot(d.ox, d.oy);
    const color = disp > 0.5 ? mix(Math.min(1, disp / 60) * BRIGHTEN_MAX) : dotColor;

    const [sx, sy] = toScreen(d.x + d.ox, d.y + d.oy);
    ctx.beginPath();
    ctx.arc(sx, sy, DOT_R * scale, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  // Dallas marker + ping, always on top
  const [hx, hy] = toScreen(HOME.x, HOME.y);
  const phase = ((now - t0) % PING_PERIOD) / PING_PERIOD;
  ctx.beginPath();
  ctx.arc(hx, hy, (HOME.r + phase * 70) * scale, 0, Math.PI * 2);
  ctx.strokeStyle = cssVar("--home");
  ctx.globalAlpha = (1 - phase) * 0.5;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.beginPath();
  ctx.arc(hx, hy, Math.max(HOME.r * scale, 4.5), 0, Math.PI * 2);
  ctx.fillStyle = cssVar("--home");
  ctx.fill();
  ctx.lineWidth = Math.max(HOME.stroke * scale, 1.5);
  ctx.strokeStyle = "#fff";
  ctx.stroke();

  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
